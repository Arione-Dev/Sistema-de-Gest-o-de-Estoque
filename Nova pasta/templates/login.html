<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ajuste de Estoque</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <h2>Login</h2>
            <p>Acesse o sistema de ajuste de estoque</p>
            <div class="login-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="matriculaInput" placeholder="Matrícula" autocomplete="off">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="senhaInput" placeholder="Senha" autocomplete="off">
                </div>
                <button onclick="login()">Entrar</button>
            </div>
        </div>
    </div>
    <script src="/static/login.js"></script>
