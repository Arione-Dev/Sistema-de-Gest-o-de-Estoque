<body>
    <div id="side-panel">
        <div id="side-panel-content">
            <button id="print-btn" onclick="prepareAndPrint()">Imprimir Relatório</button>
            <h3>Transportadoras</h3>
            <div class="input-group"><input type="text" id="carrier-name-input" placeholder="Nome da nova transportadora"><button onclick="addNewCarrier()">Adicionar</button></div>
            <div id="carrier-list"><ul id="carriers-ul"></ul></div>
            <hr style="margin: 20px 0;">
            <h3>Cidades Atendidas</h3>
            <p id="selected-carrier-name">Selecione uma transportadora para começar.</p>
            <input type="text" id="city-search-input" placeholder="Buscar cidade..." onkeyup="filterCityList()">
            <div id="city-selector"></div>
        </div>
    </div>
    <div id="map-container">
        <div id="map"></div>
        <button id="toggle-panel-btn" onclick="togglePanel()">☰</button>
        <div id="print-legend"></div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- ESTADO GLOBAL E INICIALIZAÇÃO DO MAPA ---
        let municipalitiesData = null, carriers = [], selectedCarrier = null, totalMunicipalities = 0;
        const municipalityLayers = {}, DEFAULT_CITY_COLOR = '#CCCCCC';
        let printMaskLayer = null;

        const map = L.map('map').setView([-5.7945, -36.9541], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);

        // --- FUNÇÕES DE COMUNICAÇÃO COM A API ---

        async function apiRequest(endpoint, method = 'GET', body = null) {
            try {
                const options = {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                };
                if (body) {
                    options.body = JSON.stringify(body);
                }
                const response = await fetch(`/api${endpoint}`, options);
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Erro na comunicação com o servidor.');
                }
                return response.status !== 204 ? await response.json() : null; // 204 No Content
            } catch (error) {
                console.error(`Erro na API [${method} ${endpoint}]:`, error);
                alert(`Erro: ${error.message}`);
                throw error;
            }
        }

        // --- FUNÇÕES DE LÓGICA DA APLICAÇÃO ---

        function togglePanel() { document.body.classList.toggle('panel-collapsed'); setTimeout(() => map.invalidateSize(), 300); }

        async function addNewCarrier() {
            const nameInput = document.getElementById('carrier-name-input');
            const name = nameInput.value.trim();
            if (!name) return;
            
            const randomHue = Math.floor(Math.random() * 360);
            const newCarrierData = { nome: name, cor: `hsl(${randomHue}, 90%, 50%)` };
            
            const savedCarrier = await apiRequest('/transportadoras', 'POST', newCarrierData);
            if (savedCarrier) {
                carriers.push(savedCarrier);
                nameInput.value = '';
                selectCarrier(savedCarrier);
            }
        }

        async function updateCarrierColor(carrierId, newColor) {
            const carrier = carriers.find(c => c.id === carrierId);
            if (!carrier) return;
            
            await apiRequest(`/transportadoras/${carrierId}/cor`, 'PUT', { cor: newColor });
            carrier.cor = newColor;
            updateMapColors();
            renderCarrierList();
        }
        
        async function deleteCarrier(carrierId, event) {
            event.stopPropagation();
            const carrier = carriers.find(c => c.id === carrierId);
            if (!carrier) return;

            if (confirm(`Tem certeza que deseja excluir a transportadora "${carrier.nome}"?`)) {
                await apiRequest(`/transportadoras/${carrierId}`, 'DELETE');
                carriers = carriers.filter(c => c.id !== carrierId);
                if (selectedCarrier && selectedCarrier.id === carrierId) {
                    selectedCarrier = null;
                    document.getElementById('selected-carrier-name').textContent = 'Selecione uma transportadora para começar.';
                }
                renderCarrierList(); renderSelectedCarrierCities(); updateMapColors();
            }
        }
        
        function getCarrierForCity(cityName) { return carriers.find(carrier => carrier.cidades.includes(cityName)); }
        
        function selectCarrier(carrierToSelect) {
            selectedCarrier = carrierToSelect;
            document.getElementById('selected-carrier-name').textContent = `Editando: ${selectedCarrier.nome}`;
            document.getElementById('city-search-input').value = '';
            filterCityList();
            renderCarrierList(); 
            renderSelectedCarrierCities(); 
            zoomToCarrierCities();
        }
        
        function zoomToCarrierCities() {
            if (!selectedCarrier || selectedCarrier.cidades.length === 0) { map.setView([-5.7945, -36.9541], 8); return; }
            const cityLayers = selectedCarrier.cidades.map(cityName => municipalityLayers[cityName]).filter(Boolean);
            if (cityLayers.length > 0) { map.fitBounds(L.featureGroup(cityLayers).getBounds().pad(0.2)); }
        }
        
        async function handleCityAssignment(cityName) {
            if (!selectedCarrier) { alert("Por favor, selecione uma transportadora no painel."); return; }
            const cityOwner = getCarrierForCity(cityName);
            
            if (cityOwner && cityOwner.id === selectedCarrier.id) {
                // Remove a cidade
                await apiRequest(`/transportadoras/${selectedCarrier.id}/cidades`, 'DELETE', { nome_cidade: cityName });
                selectedCarrier.cidades = selectedCarrier.cidades.filter(c => c !== cityName);
            } else if (!cityOwner) {
                // Adiciona a cidade
                await apiRequest(`/transportadoras/${selectedCarrier.id}/cidades`, 'POST', { nome_cidade: cityName });
                selectedCarrier.cidades.push(cityName);
            } else {
                alert(`A cidade de ${cityName} já é atendida por "${cityOwner.nome}".`);
                return;
            }
            updateMapColors(); renderSelectedCarrierCities(); renderCarrierList();
        }

        function handleCityClickOnMap(e) { handleCityAssignment(e.target.feature.properties.name); }
        function handleCitySelectionChange(checkbox) { handleCityAssignment(checkbox.value); }
        
        // --- FUNÇÕES DE RENDERIZAÇÃO E IMPRESSÃO ---

        function updateMapColors() { /* (sem alterações) */ }
        function renderCarrierList() { /* (sem alterações) */ }
        function populateCitySelector() { /* (sem alterações) */ }
        function renderSelectedCarrierCities() { /* (sem alterações) */ }
        function filterCityList() { /* (sem alterações) */ }
        async function createPrintMask() { /* (sem alterações) */ }
        async function prepareAndPrint() { /* (sem alterações) */ }
        
        async function initializeApp() {
            try {
                // Carrega os dados das transportadoras da API
                carriers = await apiRequest('/transportadoras');
                
                // Carrega o mapa (geometria)
                const response = await fetch('https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-24-mun.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                municipalitiesData = await response.json();
                totalMunicipalities = municipalitiesData.features.length;
                L.geoJSON(municipalitiesData, { style: { color: "#fff", weight: 1, fillColor: DEFAULT_CITY_COLOR, fillOpacity: 0.7 }, onEachFeature: (feature, layer) => { municipalityLayers[feature.properties.name] = layer; layer.bindPopup(feature.properties.name); layer.on('click', handleCityClickOnMap); } }).addTo(map);
                
                // Renderiza tudo com os dados carregados
                populateCitySelector(); renderCarrierList(); renderSelectedCarrierCities(); updateMapColors();

                window.matchMedia('print').addEventListener('change', (e) => { if (!e.matches && printMaskLayer && map.hasLayer(printMaskLayer)) { map.removeLayer(printMaskLayer); } });
            } catch (error) { console.error('Falha ao inicializar a aplicação:', error); }
        }
        window.onload = initializeApp;

        // CÓDIGO COMPLETO DAS FUNÇÕES PARA GARANTIR FUNCIONALIDADE
        (function(){
            updateMapColors = function() { Object.values(municipalityLayers).forEach(layer => layer.setStyle({ fillColor: DEFAULT_CITY_COLOR })); carriers.forEach(carrier => { carrier.cidades.forEach(cityName => { if (municipalityLayers[cityName]) { municipalityLayers[cityName].setStyle({ fillColor: carrier.cor }); } }); }); };
            renderCarrierList = function() { const ul = document.getElementById('carriers-ul'); ul.innerHTML = ''; carriers.forEach(carrier => { const li = document.createElement('li'); if (selectedCarrier && selectedCarrier.id === carrier.id) li.classList.add('active'); const percentage = totalMunicipalities > 0 ? (carrier.cidades.length / totalMunicipalities) * 100 : 0; const sanitizedName = carrier.nome.replace(/\s+/g, '-'); li.innerHTML = `<div><div class="carrier-header"><div class="carrier-info" onclick="selectCarrier(carriers.find(c => c.id === ${carrier.id}))"><label class="color-picker-wrapper"><div class="color-swatch-display" style="background-color: ${carrier.cor};"></div><input type="color" value="${carrier.cor}" oninput="updateCarrierColor(${carrier.id}, this.value, this)" onclick="event.stopPropagation()"></label><span>${carrier.nome}</span></div><button class="delete-btn" onclick="deleteCarrier(${carrier.id}, event)">🗑️</button></div><div class="carrier-stats"><div class="progress-bar-container"><div class="progress-bar" id="progress-${sanitizedName}" style="background-color:${carrier.cor}; width: ${percentage}%;"></div></div><span>${carrier.cidades.length} de ${totalMunicipalities} cidades (${percentage.toFixed(1)}%)</span></div></div>`; ul.appendChild(li); }); };
            populateCitySelector = function() { const container = document.getElementById('city-selector'); container.innerHTML = ''; const sortedFeatures = municipalitiesData.features.sort((a, b) => a.properties.name.localeCompare(b.properties.name)); sortedFeatures.forEach(feature => { const cityName = feature.properties.name; const itemDiv = document.createElement('div'); itemDiv.className = 'city-item'; itemDiv.innerHTML = `<label><input type="checkbox" value="${cityName}" onchange="handleCitySelectionChange(this)"><span>${cityName}</span><span class="city-taken-info" id="info-${cityName.replace(/\s+/g, '')}"></span></label>`; container.appendChild(itemDiv); }); };
            renderSelectedCarrierCities = function() { const cityCheckboxes = document.querySelectorAll('#city-selector input[type="checkbox"]'); if (!selectedCarrier) { cityCheckboxes.forEach(checkbox => { checkbox.checked = false; checkbox.disabled = true; const infoSpan = document.getElementById(`info-${checkbox.value.replace(/\s+/g, '')}`); if(infoSpan) infoSpan.textContent = ''; }); return; } cityCheckboxes.forEach(checkbox => { const cityName = checkbox.value; const infoSpan = document.getElementById(`info-${cityName.replace(/\s+/g, '')}`); const cityOwner = getCarrierForCity(cityName); checkbox.disabled = false; if(infoSpan) infoSpan.textContent = ''; if (cityOwner) { if (selectedCarrier.id === cityOwner.id) { checkbox.checked = true; } else { checkbox.checked = false; checkbox.disabled = true; if(infoSpan) infoSpan.textContent = `(Atendida por ${cityOwner.nome})`; } } else { checkbox.checked = false; } }); };
            filterCityList = function() { const searchTerm = document.getElementById('city-search-input').value.toLowerCase().trim(); const cityItems = document.querySelectorAll('#city-selector .city-item'); cityItems.forEach(item => { const checkbox = item.querySelector('input[type="checkbox"]'); if (checkbox.value.toLowerCase().includes(searchTerm)) { item.style.display = 'block'; } else { item.style.display = 'none'; } }); };
            createPrintMask = async function() { if (printMaskLayer) return; try { const response = await fetch('https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-24-mun.json'); const rnStateData = await response.json(); const outerRing = [[-180, -90], [180, -90], [180, 90], [-180, 90], [-180, -90]]; const holes = rnStateData.features.map(feature => feature.geometry.coordinates); const invertedPolygon = { type: 'Polygon', coordinates: [outerRing, ...holes.flat(1)] }; printMaskLayer = L.geoJSON(invertedPolygon, { pane: 'tooltipPane', style: { color: 'transparent', fillColor: '#FFFFFF', fillOpacity: 1, interactive: false } }); } catch (error) { console.error("Erro ao criar máscara de impressão:", error); } };
            prepareAndPrint = async function() { await createPrintMask(); if (printMaskLayer) { printMaskLayer.addTo(map); } const legendContainer = document.getElementById('print-legend'); let legendHTML = '<h3>Legenda de Transportadoras</h3>'; const activeCarriers = carriers.filter(c => c.cidades.length > 0); if (activeCarriers.length === 0) { legendHTML += '<p>Nenhuma transportadora com cidades atribuídas.</p>'; } else { activeCarriers.forEach(carrier => { const percentage = (carrier.cidades.length / totalMunicipalities) * 100; legendHTML += `<div class="legend-item"><div class="legend-color-box" style="background-color: ${carrier.cor};"></div><span>${carrier.nome} - ${percentage.toFixed(1)}%</span></div>`; }); } legendContainer.innerHTML = legendHTML; window.print(); };
        })();
    </script>
</body>
</html> -->

            <h3>Cidades Atendidas</h3>

    <script>
        let municipalitiesData = null, carriers = [], selectedCarrier = null, totalMunicipalities = 0;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
        
        async function apiRequest(endpoint, method = 'GET', body = null) { try { const options = { method, headers: { 'Content-Type': 'application/json' }, }; if (body) { options.body = JSON.stringify(body); } const response = await fetch(`/api${endpoint}`, options); if (!response.ok) { const errorData = await response.json(); throw new Error(errorData.error || 'Erro na comunicação com o servidor.'); } return response.status !== 204 ? await response.json() : null; } catch (error) { console.error(`Erro na API [${method} ${endpoint}]:`, error); alert(`Erro: ${error.message}`); throw error; } }
        function togglePanel() { document.body.classList.toggle('panel-collapsed'); setTimeout(() => map.invalidateSize(), 300); }
        async function addNewCarrier() { const nameInput = document.getElementById('carrier-name-input'); const name = nameInput.value.trim(); if (!name) return; const randomHue = Math.floor(Math.random() * 360); const newCarrierData = { nome: name, cor: `hsl(${randomHue}, 90%, 50%)` }; const savedCarrier = await apiRequest('/transportadoras', 'POST', newCarrierData); if (savedCarrier) { carriers.push(savedCarrier); nameInput.value = ''; selectCarrier(savedCarrier); } }
        async function updateCarrierColor(carrierId, newColor, inputElement) { const carrier = carriers.find(c => c.id === carrierId); if (!carrier) return; if (inputElement && inputElement.previousElementSibling) { inputElement.previousElementSibling.style.backgroundColor = newColor; } const sanitizedName = carrier.nome.replace(/\s+/g, '-'); const progressBar = document.getElementById(`progress-${sanitizedName}`); if (progressBar) { progressBar.style.backgroundColor = newColor; } await apiRequest(`/transportadoras/${carrierId}/cor`, 'PUT', { cor: newColor }); carrier.cor = newColor; updateMapColors(); }
        async function deleteCarrier(carrierId, event) { event.stopPropagation(); const carrier = carriers.find(c => c.id === carrierId); if (!carrier) return; if (confirm(`Tem certeza que deseja excluir a transportadora "${carrier.nome}"?`)) { await apiRequest(`/transportadoras/${carrierId}`, 'DELETE'); carriers = carriers.filter(c => c.id !== carrierId); if (selectedCarrier && selectedCarrier.id === carrierId) { selectedCarrier = null; document.getElementById('selected-carrier-name').textContent = 'Selecione uma transportadora para começar.'; } renderCarrierList(); renderSelectedCarrierCities(); updateMapColors(); } }
        function getCarrierForCity(cityName) { return carriers.find(carrier => carrier.cidades.includes(cityName)); }
        function selectCarrier(carrierToSelect) { selectedCarrier = carrierToSelect; document.getElementById('selected-carrier-name').textContent = `Editando: ${selectedCarrier.nome}`; document.getElementById('city-search-input').value = ''; filterCityList(); renderCarrierList(); renderSelectedCarrierCities(); zoomToCarrierCities(); }
        function zoomToCarrierCities() { if (!selectedCarrier || selectedCarrier.cidades.length === 0) { map.setView([-5.7945, -36.9541], 8); return; } const cityLayers = selectedCarrier.cidades.map(cityName => municipalityLayers[cityName]).filter(Boolean); if (cityLayers.length > 0) { map.fitBounds(L.featureGroup(cityLayers).getBounds().pad(0.2)); } }
        async function handleCityAssignment(cityName) { if (!selectedCarrier) { alert("Por favor, selecione uma transportadora no painel."); return; } const cityOwner = getCarrierForCity(cityName); if (cityOwner && cityOwner.id === selectedCarrier.id) { await apiRequest(`/transportadoras/${selectedCarrier.id}/cidades`, 'DELETE', { nome_cidade: cityName }); selectedCarrier.cidades = selectedCarrier.cidades.filter(c => c !== cityName); } else if (!cityOwner) { await apiRequest(`/transportadoras/${selectedCarrier.id}/cidades`, 'POST', { nome_cidade: cityName }); selectedCarrier.cidades.push(cityName); } else { alert(`A cidade de ${cityName} já é atendida por "${cityOwner.nome}".`); return; } updateMapColors(); renderSelectedCarrierCities(); renderCarrierList(); }
        function handleCityClickOnMap(e) { handleCityAssignment(e.target.feature.properties.name); }
        function handleCitySelectionChange(checkbox) { handleCityAssignment(checkbox.value); }
        function updateMapColors() { Object.values(municipalityLayers).forEach(layer => layer.setStyle({ fillColor: DEFAULT_CITY_COLOR })); carriers.forEach(carrier => { carrier.cidades.forEach(cityName => { if (municipalityLayers[cityName]) { municipalityLayers[cityName].setStyle({ fillColor: carrier.cor }); } }); }); };
        function renderCarrierList() { const ul = document.getElementById('carriers-ul'); ul.innerHTML = ''; carriers.forEach(carrier => { const li = document.createElement('li'); if (selectedCarrier && selectedCarrier.id === carrier.id) li.classList.add('active'); const percentage = totalMunicipalities > 0 ? (carrier.cidades.length / totalMunicipalities) * 100 : 0; const sanitizedName = carrier.nome.replace(/\s+/g, '-'); li.innerHTML = `<div><div class="carrier-header"><div class="carrier-info" onclick="selectCarrier(carriers.find(c => c.id === ${carrier.id}))"><label class="color-picker-wrapper"><div class="color-swatch-display" style="background-color: ${carrier.cor};"></div><input type="color" value="${carrier.cor}" oninput="updateCarrierColor(${carrier.id}, this.value, this)" onclick="event.stopPropagation()"></label><span>${carrier.nome}</span></div><button class="delete-btn" onclick="deleteCarrier(${carrier.id}, event)">🗑️</button></div><div class="carrier-stats"><div class="progress-bar-container"><div class="progress-bar" id="progress-${sanitizedName}" style="background-color:${carrier.cor}; width: ${percentage}%;"></div></div><span>${carrier.cidades.length} de ${totalMunicipalities} cidades (${percentage.toFixed(1)}%)</span></div></div>`; ul.appendChild(li); }); };
        function populateCitySelector() { const container = document.getElementById('city-selector'); container.innerHTML = ''; const sortedFeatures = municipalitiesData.features.sort((a, b) => a.properties.name.localeCompare(b.properties.name)); sortedFeatures.forEach(feature => { const cityName = feature.properties.name; const itemDiv = document.createElement('div'); itemDiv.className = 'city-item'; itemDiv.innerHTML = `<label><input type="checkbox" value="${cityName}" onchange="handleCitySelectionChange(this)"><span>${cityName}</span><span class="city-taken-info" id="info-${cityName.replace(/\s+/g, '')}"></span></label>`; container.appendChild(itemDiv); }); };

        function filterCityList() { const searchTerm = document.getElementById('city-search-input').value.toLowerCase().trim(); const cityItems = document.querySelectorAll('#city-selector .city-item'); cityItems.forEach(item => { const checkbox = item.querySelector('input[type="checkbox"]'); if (checkbox.value.toLowerCase().includes(searchTerm)) { item.style.display = 'block'; } else { item.style.display = 'none'; } }); };
        
        async function createPrintMask() {
            if (printMaskLayer) return;
            try {
                const response = await fetch('https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-24-mun.json');
                const rnStateData = await response.json();
                const outerRing = [[-180, -90], [180, -90], [180, 90], [-180, 90], [-180, -90]];
                const holes = rnStateData.features.map(feature => feature.geometry.coordinates);
                const invertedPolygon = { type: 'Polygon', coordinates: [outerRing, ...holes.flat(1)] };
                printMaskLayer = L.geoJSON(invertedPolygon, { pane: 'tooltipPane', style: { color: 'transparent', fillColor: '#FFFFFF', fillOpacity: 1, interactive: false } });
            } catch (error) { console.error("Erro ao criar máscara de impressão:", error); }
        }

            const stateBounds = L.geoJSON(municipalitiesData).getBounds();
            map.fitBounds(stateBounds.pad(0.1));
            setTimeout(async () => {
                await createPrintMask();
                if (printMaskLayer) { printMaskLayer.addTo(map); }

                // --- 1. Cria o HTML da legenda ---

                });
                
                // --- 2. Cria o elemento da legenda e o adiciona ao container do mapa ---
                const legendDiv = document.createElement('div');
                legendDiv.id = 'print-legend-overlay';
                legendDiv.innerHTML = legendHTML;
                document.getElementById('map-container').appendChild(legendDiv);

                // --- 3. Prepara as tabelas para a segunda página ---
                const reportContainer = document.getElementById('print-report');
                let reportHTML = '<div class="report-table-container">';
                if (activeCarriers.length === 0) {
                    reportHTML = '<p style="text-align:center; font-size: 14pt;">Nenhuma transportadora com cidades atribuídas para o relatório.</p>';
                } else {
                    activeCarriers.forEach(carrier => {

                        const sortedCities = [...carrier.cidades].sort();
                        sortedCities.forEach(city => { reportHTML += `<tr><td>${city}</td></tr>`; });
                        reportHTML += `</tbody></table></div>`;
                    });

                reportContainer.innerHTML = reportHTML;
                
                // --- 4. Chama a impressão ---
                window.print();

        }
        
        async function initializeApp() {
            try {
                // Mock para ambiente de desenvolvimento
                if (typeof apiRequest === 'function' && !window.location.protocol.startsWith('http')) {
                    carriers = [];
                } else {
                    carriers = await apiRequest('/transportadoras');

                        const legend = document.getElementById('print-legend-overlay');
                        if (legend) {
                            legend.remove();
                        }
                    }
                });
            } catch (error) { console.error('Falha ao inicializar a aplicação:', error); }

                selectedCarrier.cidades.push(cityName);
            } else {
                alert(`A cidade de ${cityName} já é atendida por "${cityOwner.nome}".`);
                return;
            }
            updateMapColors();
            renderSelectedCarrierCities();
            renderCarrierList();
        }
        function handleCityClickOnMap(e) { handleCityAssignment(e.target.feature.properties.name); }
        function handleCitySelectionChange(checkbox) { handleCityAssignment(checkbox.value); }
        function updateMapColors() { Object.values(municipalityLayers).forEach(layer => layer.setStyle({ fillColor: DEFAULT_CITY_COLOR })); carriers.forEach(carrier => { carrier.cidades.forEach(cityName => { if (municipalityLayers[cityName]) { municipalityLayers[cityName].setStyle({ fillColor: carrier.cor }); } }); }); };
        function renderCarrierList() { const ul = document.getElementById('carriers-ul'); ul.innerHTML = ''; carriers.forEach(carrier => { const li = document.createElement('li'); if (selectedCarrier && selectedCarrier.id === carrier.id) li.classList.add('active'); const percentage = totalMunicipalities > 0 ? (carrier.cidades.length / totalMunicipalities) * 100 : 0; const sanitizedName = carrier.nome.replace(/\s+/g, '-'); li.innerHTML = `<div><div class="carrier-header"><div class="carrier-info" onclick="selectCarrier(carriers.find(c => c.id === ${carrier.id}))"><label class="color-picker-wrapper"><div class="color-swatch-display" style="background-color: ${carrier.cor};"></div><input type="color" value="${carrier.cor}" oninput="updateCarrierColor(${carrier.id}, this.value, this)" onclick="event.stopPropagation()"></label><span>${carrier.nome}</span></div><button class="delete-btn" onclick="deleteCarrier(${carrier.id}, event)">🗑️</button></div><div class="carrier-stats"><div class="progress-bar-container"><div class="progress-bar" id="progress-${sanitizedName}" style="background-color:${carrier.cor}; width: ${percentage}%;"></div></div><span>${carrier.cidades.length} de ${totalMunicipalities} cidades (${percentage.toFixed(1)}%)</span></div></div>`; ul.appendChild(li); }); };
        function populateCitySelector() { const container = document.getElementById('city-selector'); container.innerHTML = ''; const sortedFeatures = municipalitiesData.features.sort((a, b) => a.properties.name.localeCompare(b.properties.name)); sortedFeatures.forEach(feature => { const cityName = feature.properties.name; const itemDiv = document.createElement('div'); itemDiv.className = 'city-item'; itemDiv.innerHTML = `<label><input type="checkbox" value="${cityName}" onchange="handleCitySelectionChange(this)"><span>${cityName}</span><span class="city-taken-info" id="info-${cityName.replace(/\s+/g, '')}"></span></label>`; container.appendChild(itemDiv); }); };
        function renderSelectedCarrierCities() { const cityCheckboxes = document.querySelectorAll('#city-selector input[type="checkbox"]'); if (!selectedCarrier) { cityCheckboxes.forEach(checkbox => { checkbox.checked = false; checkbox.disabled = true; const infoSpan = document.getElementById(`info-${checkbox.value.replace(/\s+/g, '')}`); if(infoSpan) infoSpan.textContent = ''; }); return; } cityCheckboxes.forEach(checkbox => { const cityName = checkbox.value; const infoSpan = document.getElementById(`info-${cityName.replace(/\s+/g, '')}`); const cityOwner = getCarrierForCity(cityName); checkbox.disabled = false; if(infoSpan) infoSpan.textContent = ''; if (cityOwner) { if (selectedCarrier.id === cityOwner.id) { checkbox.checked = true; } else { checkbox.checked = false; checkbox.disabled = true; if(infoSpan) infoSpan.textContent = `(Atendida por ${cityOwner.nome})`; } } else { checkbox.checked = false; } }); };
        function filterCityList() { const searchTerm = document.getElementById('city-search-input').value.toLowerCase().trim(); const cityItems = document.querySelectorAll('#city-selector .city-item'); cityItems.forEach(item => { const checkbox = item.querySelector('input[type="checkbox"]'); if (checkbox.value.toLowerCase().includes(searchTerm)) { item.style.display = 'block'; } else { item.style.display = 'none'; } }); };
        
        async function createPrintMask() {
            if (printMaskLayer) return;
            try {
                const response = await fetch('https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-24-mun.json');
                const rnStateData = await response.json();
                const outerRing = [[-180, -90], [180, -90], [180, 90], [-180, 90], [-180, -90]];
                const holes = rnStateData.features.map(feature => feature.geometry.coordinates);
                const invertedPolygon = { type: 'Polygon', coordinates: [outerRing, ...holes.flat(1)] };
                printMaskLayer = L.geoJSON(invertedPolygon, { pane: 'tooltipPane', style: { color: 'transparent', fillColor: '#FFFFFF', fillOpacity: 1, interactive: false } });
            } catch (error) { console.error("Erro ao criar máscara de impressão:", error); }
        }

        async function prepareAndPrint() {
            const stateBounds = L.geoJSON(municipalitiesData).getBounds();
            map.fitBounds(stateBounds.pad(0.1));
            setTimeout(async () => {
                await createPrintMask();
                if (printMaskLayer) { printMaskLayer.addTo(map); }
                
                const activeCarriers = carriers.filter(c => c.cidades.length > 0);

                const titleHTML = `<h1>Relatório de Cobertura Logística</h1><p>Rio Grande do Norte</p>`;
                const titleDiv = document.createElement('div');
                titleDiv.id = 'print-title-overlay';
                titleDiv.innerHTML = titleHTML;
                document.getElementById('map-container').appendChild(titleDiv);
                
                let legendHTML = '<div class="print-legend-title">Resumo das Transportadoras</div>';
                activeCarriers.forEach(carrier => {
                    const percentage = totalMunicipalities > 0 ? (carrier.cidades.length / totalMunicipalities) * 100 : 0;
                    legendHTML += `
                        <div class="print-legend-item">
                            <div class="print-legend-color-box" style="background-color: ${carrier.cor};"></div>
                            <span>${carrier.nome} (${percentage.toFixed(1)}%)</span>
                        </div>
                    `;
                });
                const legendDiv = document.createElement('div');
                legendDiv.id = 'print-legend-overlay';
                legendDiv.innerHTML = legendHTML;
                document.getElementById('map-container').appendChild(legendDiv);

                const reportContainer = document.getElementById('print-report');
                let reportHTML = '<div class="report-table-container">';
                if (activeCarriers.length === 0) {
                    reportHTML = '<p style="text-align:center; font-size: 14pt;">Nenhuma transportadora com cidades atribuídas para o relatório.</p>';
                } else {
                    activeCarriers.forEach(carrier => {
                        reportHTML += `<div class="report-column"><table class="city-table"><thead><tr><th><div class="report-carrier-header"><span>TRANSPORTADORA: ${carrier.nome.toUpperCase()}</span><div class="legend-color-box" style="background-color: ${carrier.cor};"></div></div></th></tr></thead><tbody>`;
                        const sortedCities = [...carrier.cidades].sort();
                        sortedCities.forEach(city => { reportHTML += `<tr><td>${city}</td></tr>`; });
                        reportHTML += `</tbody></table></div>`;
                    });
                }
                reportHTML += '</div>';
                reportContainer.innerHTML = reportHTML;
                
                window.print();
            }, 500);
        }
        
        async function initializeApp() {
            try {
                if (typeof apiRequest === 'function' && !window.location.protocol.startsWith('http')) {
                    carriers = [];
                } else {
                    carriers = await apiRequest('/transportadoras');
                }
                const response = await fetch('https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-24-mun.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                municipalitiesData = await response.json();
                totalMunicipalities = municipalitiesData.features.length;
                
                L.geoJSON(municipalitiesData, { 
                    style: { color: "#fff", weight: 1, fillColor: DEFAULT_CITY_COLOR, fillOpacity: 0.7 }, 
                    onEachFeature: (feature, layer) => { 
                        municipalityLayers[feature.properties.name] = layer; 
                        layer.bindPopup(feature.properties.name);
                        layer.bindTooltip(feature.properties.name, {
                            permanent: true,
                            direction: 'center',
                            className: 'city-label'
                        }).openTooltip();
                        layer.on('click', handleCityClickOnMap); 
                    } 
                }).addTo(map);

                populateCitySelector(); 
                renderCarrierList(); 
                renderSelectedCarrierCities(); 
                updateMapColors();
                
                window.matchMedia('print').addEventListener('change', (e) => { 
                    if (!e.matches) {
                        if (printMaskLayer && map.hasLayer(printMaskLayer)) { 
                            map.removeLayer(printMaskLayer); 
                        }
                        const legend = document.getElementById('print-legend-overlay');
                        if (legend) legend.remove();
                        const title = document.getElementById('print-title-overlay');
                        if (title) title.remove();
                    }
                });
            } catch (error) { console.error('Falha ao inicializar a aplicação:', error); }
        }
        window.onload = initializeApp;
        function filterCityList(event) {
        const searchTerm = document.getElementById('city-search-input').value.toLowerCase().trim();
        const cityItems = document.querySelectorAll('#city-selector .city-item');
        
        cityItems.forEach(item => {
            const cityName = item.querySelector('span').textContent.toLowerCase();
            
            if (cityName.includes(searchTerm)) {
                item.style.display = 'block';
            } else {
                item.style.display = 'none';
            }
        });

        // --- NOVA LÓGICA ADICIONADA ---
        // Verifica se a tecla pressionada foi "Enter"
        if (event && event.key === 'Enter') {
            // Encontra a primeira cidade visível na lista filtrada
            const firstVisibleCity = [...cityItems].find(item => item.style.display === 'block');
            
            if (firstVisibleCity) {
                const cityName = firstVisibleCity.querySelector('input').value;
                // Encontra a camada do mapa correspondente a essa cidade
                const layerKey = Object.keys(municipalityLayers).find(key => key.toLowerCase() === cityName.toLowerCase());
                
                if (layerKey) {
                    const cityLayer = municipalityLayers[layerKey];
                    // Dá zoom na cidade e abre um popup com o nome dela
                    map.fitBounds(cityLayer.getBounds(), { maxZoom: 12, paddingTopLeft: [380, 20] });
                    cityLayer.openPopup();
                }
            } else if (searchTerm) {
                // Avisa o usuário se nenhuma cidade for encontrada
                alert(`Nenhuma cidade encontrada com o nome "${searchTerm}".`);
            }
        }
    }
    </script>
