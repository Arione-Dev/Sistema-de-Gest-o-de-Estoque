            if (!matricula || !senha) {

        class Pulse {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = Math.min(width, height) * 0.8;
                this.speed = Math.random() * 0.2 + 0.2;
                this.opacity = 1;

            update() {
                this.radius += this.speed;
                this.opacity = 1 - this.radius / this.maxRadius;

                ctx.stroke();

                ctx.lineTo(width, y);

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        #neural-canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        .login-card {
            width: 100%; max-width: 400px; padding: 40px; border-radius: 12px;
            position: relative; z-index: 2;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(56, 189, 248, 0.1);
            color: #e0e7ff; text-align: center;
            /* --- MUDANÇA: Adicionada transição para a animação --- */
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.5s ease-out;
        }

        /* --- MUDANÇA: Classe da animação de saída "Zoom Out" --- */
        .login-card.is-exiting {
            transform: scale(0.2);
            opacity: 0;
        }

        .logo-text-container { margin-bottom: 15px; }
        .logo-text {
            font-size: 42px; font-weight: 700; color: #e0f2fe;
            text-shadow: 0 0 4px #fff, 0 0 10px #0ea5e9, 0 0 20px #0ea5e9, 0 0 30px #0ea5e9;
            animation: pulse-glow 3s infinite alternate ease-in-out;
        }
        @keyframes pulse-glow {
            from { text-shadow: 0 0 4px #fff, 0 0 8px #0ea5e9; }
            to { text-shadow: 0 0 5px #fff, 0 0 12px #38bdf8, 0 0 25px #38bdf8; }
        }

        .login-card p { margin-bottom: 30px; font-size: 15px; color: #a5b4fc; }
        .login-card .input-group { position: relative; margin-bottom: 20px; }
        .login-card .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #64748b; }
        .login-card input, .login-card select, .login-card button {
            width: 100%; padding: 12px; font-size: 15px;
            border-radius: 8px; border: 1px solid #334155;
            outline: none; font-family: inherit; transition: all 0.3s ease;
        }
        .login-card input { background: #1e293b; color: #e0e7ff; padding-left: 40px; }
        .login-card select {
            background: #1e293b; color: #e0e7ff; padding-left: 40px; appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 15px center; background-size: 1em;
        }
        .login-card input:focus, .login-card select:focus { border-color: #38bdf8; }
        .login-card button { cursor: pointer; font-weight: bold; background: #0ea5e9; color: white; border-color: transparent; margin-top: 10px;}
        .login-card button:hover { background: #38bdf8; }
        .footer-text { margin-top: 30px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <canvas id="neural-canvas"></canvas>
    <div class="login-card">
        <div class="logo-text-container">
            <h2 class="logo-text">&lt;DataMind&gt;</h2>
        </div>
        <p>Você está a um clique do futuro!</p>
        <form class="login-form">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="matriculaInput" placeholder="Matrícula" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="senhaInput" placeholder="Senha" required>
            </div>
            <div class="input-group">
                 <i class="fas fa-desktop"></i>
                <select id="deviceType">
                    <option value="desktop">Desktop</option>
                    <option value="pda">PDA</option>
                </select>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <div class="footer-text">© 2025 - Sistema de Análise</div>
    </div>
    
    <script>
        const loginCard = document.querySelector('.login-card');

        function login(event) {
            event.preventDefault(); 
            const matricula = document.getElementById('matriculaInput').value.trim();
            const senha = document.getElementById('senhaInput').value.trim();
            if (!matricula || !senha) {
                alert("Por favor, preencha todos os campos.");
                return;
            }

            // --- MUDANÇA: LÓGICA DE ANIMAÇÃO AO INICIAR LOGIN ---
            // Adiciona a classe para iniciar a animação
            loginCard.classList.add('is-exiting');

            // Espera a animação terminar antes de prosseguir
            setTimeout(() => {
                console.log("Tentativa de login com:", { matricula, senha, dispositivo: document.getElementById('deviceType').value });

                if (typeof sendLoginRequest === "function") {
                    sendLoginRequest(matricula, senha, dispositivo);
                } else {
                    console.error("Função 'sendLoginRequest' não encontrada. Usando alerta de teste.");
                    alert("Acesso Permitido! (Modo de teste)");
                }
                
                // Remove a classe para resetar o estado caso o usuário não seja redirecionado
                 loginCard.classList.remove('is-exiting');
            }, 700); // Tempo de espera deve ser um pouco maior que a transição do CSS
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.querySelector('.login-form');
            if(loginForm) {
                loginForm.addEventListener('submit', login); 
            }
        });

        // Animação de Fundo
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        const options = { particleColor: "rgba(180, 180, 255, 0.5)", lineColor: "rgba(100, 100, 255, 0.15)", particleAmount: 50, defaultRadius: 1.5, linkRadius: 200 };
        class Particle { constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.vx = -1 + Math.random() * 2; this.vy = -1 + Math.random() * 2; this.radius = options.defaultRadius; } update() { this.x += this.vx; this.y += this.vy; if (this.x > canvas.width || this.x < 0) this.vx = -this.vx; if (this.y > canvas.height || this.y < 0) this.vy = -this.vy; } draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = options.particleColor; ctx.fill(); } }
        function linkParticles() { for (let a = 0; a < particles.length; a++) { for (let b = a; b < particles.length; b++) { let dx = particles[a].x - particles[b].x; let dy = particles[a].y - particles[b].y; let dist = Math.sqrt(dx * dx + dy * dy); if (dist < options.linkRadius) { ctx.beginPath(); ctx.moveTo(particles[a].x, particles[a].y); ctx.lineTo(particles[b].x, particles[b].y); ctx.lineWidth = 1; ctx.strokeStyle = options.lineColor; ctx.stroke(); } } } }
        function setup() { for (let i = 0; i < options.particleAmount; i++) particles.push(new Particle()); window.requestAnimationFrame(loop); }
        function loop() { ctx.clearRect(0, 0, canvas.width, canvas.height); for (const p of particles) { p.update(); p.draw(); } linkParticles(); window.requestAnimationFrame(loop); }
        setup();
        window.addEventListener("resize", () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; particles = []; setup(); });
    </script>
    
    <script src="/static/login.js"></script>
</body>
</html>
