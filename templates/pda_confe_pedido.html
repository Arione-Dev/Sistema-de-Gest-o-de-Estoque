function buscarPedidos() {
    const destino = document.getElementById('destino').value;
    if (!destino) {
        alert("Por favor, selecione um destino.");
        return;
    }

    document.getElementById('loader').style.display = 'block';
    
    // ATENÇÃO: O corpo (body) precisa ser enviado como no seu backend
    const corpoRequisicao = {

    };

    fetch('/filtrar-pedidos', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(corpoRequisicao)
    })
    .then(async response => {
        // Pega a resposta JSON independentemente do status
        const data = await response.json();

        // Se a resposta não for OK (ex: status 400, 500), usa o erro do JSON
        if (!response.ok) {
            // "data.erro" conterá a mensagem que enviamos do Flask
            // ex: "API Externa: Periodo excede 10 dias."
            throw new Error(data.erro || 'Ocorreu um erro desconhecido.');
        }
        return data; // Se deu tudo certo, retorna os dados
    })
    .then(data => {
        document.getElementById('loader').style.display = 'none';
        
        // Se o backend enviar um erro mesmo com status 200 (não deveria, mas é bom previnir)
        if (data.erro) {
            alert(data.erro);
            return;

        todosPedidosCarregados = data.pedidos;
        atualizarTabelaPedidos(data.pedidos);

    }

            modalButton.textContent = 'Iniciar Conferência';
            modalButton.disabled = false;
            document.getElementById('modalDetalhes').style.display = 'none';

        const itensParaSalvar = pedidoAtualParaConferencia.itens.map(item => ({
    numero_pedido: pedidoAtualParaConferencia.pedido,
    codigo: item.produto,
    codigo_barras: item.barras || '',
    // <<< ADICIONE A LINHA ABAIXO >>>

    }));

        const botao = document.querySelector('.modal-content button');

        fetch('/salvar-conferencia', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ itens: itensParaSalvar })
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(errData => {
                    throw new Error(errData.erro || 'Não foi possível conectar ao servidor.');
                });
            }
            return response.json();

            if (data.status === 'ok') {

                window.location.href = "/pda_conferencia_pedido";

            botao.textContent = 'Iniciar Conferência';
            botao.disabled = false;
        });
    }

        limparTabela();
        document.getElementById('loader').style.display = 'block';
        document.querySelector('button').disabled = true;

        let dataInicioIntervalo = new Date(dataInicial);

        try {
            while (dataInicioIntervalo <= dataFinal) {
                let dataFimIntervalo = new Date(dataInicioIntervalo);
                dataFimIntervalo.setDate(dataInicioIntervalo.getDate() + 9); // Intervalo de 10 dias

                // Garante que o fim do intervalo não ultrapasse a data final selecionada
                if (dataFimIntervalo > dataFinal) {
                    dataFimIntervalo = dataFinal;
                }

                const body = {
                    destino: destino,
                    data_inicial: dataInicioIntervalo.toISOString().split('T')[0],
                    data_final: dataFimIntervalo.toISOString().split('T')[0]
                };

                // Mostra no console o período que está sendo buscado
                console.log("Buscando período:", body.data_inicial, "a", body.data_final);

                const response = await fetch('/filtrar-pedidos', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (data.erro) {
                    throw new Error(data.erro);
                }

                // Adiciona os pedidos encontrados ao array principal
                if (data.pedidos && data.pedidos.length > 0) {
                   const novosPedidos = data.pedidos.filter(p => !todosPedidosCarregados.some(pc => pc.pedido === p.pedido));
                   todosPedidosCarregados.push(...novosPedidos);
                }
                
                // Avança para o próximo intervalo de 10 dias
                dataInicioIntervalo.setDate(dataInicioIntervalo.getDate() + 10);
            }
            
            // Ordena os pedidos por data após todas as buscas
            todosPedidosCarregados.sort((a, b) => new Date(b.data) - new Date(a.data));
            atualizarTabelaPedidos(todosPedidosCarregados);

        } catch (error) {
            console.error('Erro:', error);
            alert('Erro ao carregar pedidos: ' + error.message);
        } finally {
            document.getElementById('loader').style.display = 'none';
            document.querySelector('button').disabled = false;
        }
    }

    function atualizarTabelaPedidos(pedidos) {

        if (pedidos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Nenhum pedido encontrado para o período e destino selecionados.</td></tr>';

    function verificarEtiqueta() {
        const codigoEtiqueta = document.getElementById("codigoEtiqueta").value.trim();

        if (todosPedidosCarregados.length === 0) {
            alert("Clique em 'Buscar Pedidos' antes de escanear uma etiqueta.");
            return;
        }

        const numeroPedido = codigoEtiqueta.split('-')[0];
        const pedidoEncontrado = todosPedidosCarregados.find(p => p.pedido == numeroPedido);
        
        if (pedidoEncontrado) {
            abrirDetalhes(pedidoEncontrado.pedido);

            alert("Pedido não encontrado na lista carregada. Verifique o período da busca.");
