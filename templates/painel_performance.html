const fimCampanha = new Date('2025-09-11T23:59:59');
const hoje = new Date();

// --- DADOS DAS LOJAS ---
const storesData = [
    { id: 121, name: 'SAC NORTE SHOPPING', meta: 10000.00, vendido: 1620.83, projecao: 61.09 },

    { id: 100, name: 'SACOLAO LAGOA NOVA', meta: 25000.00, vendido: 3695.63, projecao: 55.72 },
];

function formatCurrency(value) {
    return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

// --- LÓGICA DE CÁLCULO DINÂMICO ---
const totalDiasCampanha = Math.ceil((fimCampanha - inicioCampanha) / (1000 * 60 * 60 * 24));
const diasCorridos = Math.max(1, Math.ceil((hoje - inicioCampanha) / (1000 * 60 * 60 * 24)));
const diasRestantes = Math.max(0, totalDiasCampanha - diasCorridos);

const dashboardContainer = document.getElementById('dashboard-container');

storesData.forEach(store => {
    const saldoAVender = store.meta - store.vendido;

                <h3 class="module-title">Análise de Ritmo</h3>

                        <div class="value ${paceClass}">${formatCurrency(mediaDiariaAtual)}</div>
                        <div class="label">Média Diária Atual</div>
                    </div>

                        <div class="value">${formatCurrency(mediaDiariaNecessaria)}</div>
                        <div class="label">Média Diária Necessária</div>
                    </div>
                </div>
                <div class="pace-summary">${paceSummary}</div>

});
