        </form>

    <script>
        // --- Elementos do DOM ---
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const messagesContainer = document.getElementById('chat-messages');
        const typingIndicator = document.getElementById('typing-indicator');

        // --- Event Listener para o envio do formulário ---
        chatForm.addEventListener('submit', async (event) => {
            event.preventDefault(); // Impede o recarregamento da página

            const userMessage = messageInput.value.trim();

            // 1. Mostra a mensagem do usuário na tela
            addMessage(userMessage, 'sent');
            messageInput.value = ''; // Limpa o campo de input

            // 2. Mostra o indicador "digitando..."
            typingIndicator.style.display = 'flex';
            scrollToBottom();

            try {
                // 3. Envia a pergunta para o backend
                const response = await fetch('http://127.0.0.1:5000/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: userMessage }),
                });

                // Esconde o indicador "digitando..."
                typingIndicator.style.display = 'none';

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Ocorreu um erro no servidor.');
                }
                
                const data = await response.json();

                // 4. Formata e mostra a resposta da IA
                const formattedResponse = formatDataAsText(data);
                addMessage(formattedResponse, 'received');

            } catch (error) {
                // Esconde o indicador "digitando..." e mostra a mensagem de erro
                typingIndicator.style.display = 'none';
                addMessage(`Erro: ${error.message}`, 'received');
            }
        });

        // --- Funções Auxiliares ---

        /**
         * Adiciona uma nova bolha de mensagem ao chat.
         * @param {string} text - O texto da mensagem.
         * @param {'sent' | 'received'} type - O tipo da mensagem ('enviada' ou 'recebida').
         */
        function addMessage(text, type) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', type);
            messageElement.innerText = text;
            messagesContainer.appendChild(messageElement);
            scrollToBottom(); // Rola para a mensagem mais recente
        }

        /**
         * Rola a área de mensagens para o final.
         */
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        /**
         * Formata os dados JSON recebidos do backend em um texto legível.
         * @param {Array<Object>} data - Um array de objetos vindo do backend.
         * @returns {string} - O texto formatado.
         */
        function formatDataAsText(data) {
            if (!Array.isArray(data) || data.length === 0) {
                return "Não encontrei resultados para sua pergunta.";
            }

            // Pega os nomes das colunas do primeiro objeto
            const headers = Object.keys(data[0]);
            let responseText = headers.join(' | ') + '\n';
            responseText += '-'.repeat(responseText.length * 1.5) + '\n';

            // Adiciona cada linha de dados
            data.forEach(row => {
                const values = headers.map(header => row[header]);
                responseText += values.join(' | ') + '\n';
            });

            return responseText;
        }

    </script>

 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zé Galego - Assistente de Dados</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap)" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
        .chat-container {
            max-width: 9000px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            overflow: hidden;
        }
        .chat-header {
            background-color: #1a4d3a; /* Darker green for header */
            color: #ffffff;
            padding: 1rem;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 6000;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            background-color: #e6f0e6; /* Light green background for messages */
        }
        .message-bubble {
            max-width: 75%;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            margin-bottom: 0.75rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #dcf8c6; /* Light green for user messages */
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background-color: #ffffff; /* White for bot messages */
            margin-right: auto;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            padding: 1rem;
            border-top: 1px solid #e0e0e0;
            background-color: #ffffff;
        }
        .input-area input {
            flex-grow: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus {
            border-color: #1a4d3a;
        }
        .input-area button {
            background-color: #1a4d3a;
            color: white;
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 25px;
            margin-left: 0.75rem;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button:hover {
            background-color: #153c2e;
        }
        .loading-indicator {
            text-align: center;
            padding: 1rem;
            color: #555;
        }
        .table-container {
            max-height: 300px; /* Limit height for scrollable tables */
            overflow-y: auto;
            margin-top: 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .data-table th, .data-table td {
            border: 1px solid #e0e0e0;
            padding: 0.6rem 0.8rem;
            text-align: left;
        }
        .data-table th {
            background-color: #f8f8f8;
            font-weight: 600;
        }
        .suggestions-box {
            background-color: #f0f8ff;
            border: 1px solid #cceeff;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        .suggestions-box h4 {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a4d3a;
        }
        .suggestions-box ul {
            list-style-type: disc;
            margin-left: 1.25rem;

            margin-bottom: 0.25rem;

            padding: 0.75rem;
            border-radius: 8px;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            Fale com o Assistente Zé Galego
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message-bubble bot-message">
                E aí, meu patrão! Sou Zé Galego, seu assistente de dados. O que você manda hoje?
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Digite sua pergunta aqui..." autocomplete="off">
            <button id="send-button">
                <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        let chatHistory = [];

        function appendMessage(sender, text, type = 'chat', data = null, visualization = null, suggestions = []) {
            const messageBubble = document.createElement('div');
            messageBubble.classList.add('message-bubble');

            if (sender === 'user') {
                messageBubble.classList.add('user-message');
                messageBubble.textContent = text;
            } else {
                messageBubble.classList.add('bot-message');
                if (type === 'chat') {
                    messageBubble.textContent = text;
                } else if (type === 'multi_data' && data) {
                    // Display data for each question
                    for (const question in data) {
                        const results = data[question];
                        const questionHeader = document.createElement('p');
                        questionHeader.innerHTML = `<strong>Dados para: "${question}"</strong>`;
                        messageBubble.appendChild(questionHeader);

                        if (results.length > 0) {
                            const tableContainer = document.createElement('div');
                            tableContainer.classList.add('table-container');
                            const table = document.createElement('table');
                            table.classList.add('data-table');
                            
                            // Table Header
                            const thead = document.createElement('thead');
                            const headerRow = document.createElement('tr');
                            Object.keys(results[0]).forEach(key => {
                                const th = document.createElement('th');
                                th.textContent = key;
                                headerRow.appendChild(th);
                            });
                            thead.appendChild(headerRow);
                            table.appendChild(thead);

                            // Table Body
                            const tbody = document.createElement('tbody');
                            results.forEach(row => {
                                const tr = document.createElement('tr');
                                Object.values(row).forEach(value => {
                                    const td = document.createElement('td');
                                    td.textContent = value;
                                    tr.appendChild(td);
                                });
                                tbody.appendChild(tr);
                            });
                            table.appendChild(tbody);
                            tableContainer.appendChild(table);
                            messageBubble.appendChild(tableContainer);
                        } else {
                            const noData = document.createElement('p');
                            noData.textContent = "Nenhum dado encontrado para esta consulta.";
                            messageBubble.appendChild(noData);
                        }
                    }

                    // Display suggestions if available
                    if (suggestions && suggestions.length > 0) {
                        const suggestionsBox = document.createElement('div');
                        suggestionsBox.classList.add('suggestions-box');
                        const suggestionsHeader = document.createElement('h4');
                        suggestionsHeader.textContent = "Próximos passos estratégicos:";
                        suggestionsBox.appendChild(suggestionsHeader);
                        const suggestionsList = document.createElement('ul');
                        suggestions.forEach(sug => {
                            const li = document.createElement('li');
                            li.textContent = sug;
                            suggestionsList.appendChild(li);
                        });
                        suggestionsBox.appendChild(suggestionsList);
                        messageBubble.appendChild(suggestionsBox);
                    }

                    // Placeholder for visualization (if implemented later)
                    if (visualization && visualization.type !== 'table') {
                        const vizInfo = document.createElement('p');
                        vizInfo.textContent = `Sugestão de visualização: ${visualization.type} (${visualization.labels_column} vs ${visualization.data_column})`;
                        messageBubble.appendChild(vizInfo);
                    }

                } else if (type === 'error') {
                    const errorDiv = document.createElement('div');
                    errorDiv.classList.add('error-message');
                    errorDiv.textContent = text;
                    messageBubble.appendChild(errorDiv);
                }
            }

            chatMessages.appendChild(messageBubble);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const question = userInput.value.trim();
            if (question === '') return;

            appendMessage('user', question);
            userInput.value = '';
            
            const loadingIndicator = document.createElement('div');
            loadingIndicator.classList.add('loading-indicator');
            loadingIndicator.textContent = 'Zé Galego está pensando...';
            chatMessages.appendChild(loadingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question, history: chatHistory }),
                });

                const data = await response.json();
                chatMessages.removeChild(loadingIndicator); // Remove loading indicator

                if (data.type === 'chat') {
                    appendMessage('bot', data.response);
                } else if (data.type === 'multi_data') {
                    appendMessage('bot', '', 'multi_data', data.response, data.visualization, data.sugestoes);
                } else if (data.type === 'error') {
                    appendMessage('bot', data.response, 'error');
                }

                // Update chat history for next turn (only store user question and bot text response)
                chatHistory.push({ role: "user", content: question });
                if (data.type === 'chat' || data.type === 'error') {
                    chatHistory.push({ role: "assistant", content: data.response });
                } else if (data.type === 'multi_data') {
                    // For data responses, summarize or store a placeholder for history
                    chatHistory.push({ role: "assistant", content: "Dados e análise estratégica foram fornecidos." });
                }

            } catch (error) {
                chatMessages.removeChild(loadingIndicator); // Remove loading indicator
                appendMessage('bot', 'Ocorreu um erro ao se comunicar com o servidor. Tente novamente.', 'error');
                console.error('Error:', error);
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
